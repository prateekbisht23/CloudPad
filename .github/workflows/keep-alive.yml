name: Keep CloudPad alive

# Pings the site so the Render free-tier service doesn't spin down and the
# Supabase free-tier project doesn't auto-pause (/healthz/ runs a DB query).
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://cloudpad.bishh.dev' }}
      WS_HEALTH_URL: ${{ vars.WS_HEALTH_URL }}
    steps:
      - name: Ping web app + database
        run: |
          # Retry: a cold Render instance can take ~1 min to boot
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$SITE_URL/healthz/"
      - name: Ping Yjs websocket server
        if: env.WS_HEALTH_URL != ''
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$WS_HEALTH_URL"
