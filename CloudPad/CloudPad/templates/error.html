{% extends "base.html" %}

{% block title %}Error - CloudPad{% endblock %}

{% block content %}
<main class="flex-1 container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto text-center">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="ri-error-warning-line text-4xl text-red-500"></i>
            </div>

            <h1 class="text-3xl font-bold text-gray-900 mb-4">Oops! Something went wrong</h1>

            {% if error_message %}
            <p class="text-gray-600 mb-6">{{ error_message }}</p>
            {% else %}
            <p class="text-gray-600 mb-6">We encountered an unexpected error. Please try again.</p>
            {% endif %}

            <div class="flex justify-center space-x-4">
                <a href="javascript:history.back()"
                    class="px-6 py-3 bg-gray-200 text-gray-700 rounded-button hover:bg-gray-300">
                    Go Back
                </a>
                <a href="/" class="px-6 py-3 bg-primary text-white rounded-button hover:bg-opacity-90">
                    Go Home
                </a>
            </div>
        </div>
    </div>
</main>
{% endblock %}
